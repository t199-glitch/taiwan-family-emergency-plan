                          className="cute-btn w-full py-3.5 bg-orange-500 hover:bg-orange-600 text-white font-bold text-sm md:text-base shadow-md cursor-pointer flex items-center justify-center gap-2"
                        >
                          <span>修正我的家庭避難包並前往下一階段：認識災害 ➔</span>
                        </button>
                      </div>
                    </div>
                  )}
                </div>
              )}

              {/* PAGE 4: HAZARDS */}
              {currentStep === 4 && (
                <div className="space-y-6">
                  <div className="space-y-1">
                    <h2 className="text-2xl font-bold text-stone-900 flex items-center gap-2">
                      <span>🌏</span>
                      <span>災害來了，不同危險需要不同避難方式</span>
                    </h2>
                    <p className="text-xs text-stone-600 font-normal">點選災害查看詳細防護步驟：</p>
                  </div>

                  <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                    {HAZARD_SCENARIOS.map(h => (
                      <button
                        key={h.id}
                        onClick={() => setSelectedHazard(h)}
                        className={`p-3.5 rounded-xl border text-xs font-medium transition cute-btn flex flex-col items-center gap-1.5 ${
                          selectedHazard.id === h.id ? 'bg-orange-500 text-white border-orange-500 shadow-md font-bold' : 'bg-white text-stone-800 border-amber-200 hover:bg-amber-50'
                        }`}
                      >
                        <span className="text-3xl">{h.icon}</span>
                        <span>{h.name}</span>
                      </button>
                    ))}
                  </div>

                  <div className="bubble-card p-6 space-y-3 text-xs font-normal">
                    <div className="font-bold text-base text-stone-900">{selectedHazard.icon} {selectedHazard.name} 防護重點</div>
                    <div className="bg-amber-50 p-4 rounded-xl border border-amber-200 text-stone-800 leading-relaxed">
                      🧭 核心防護原則：{selectedHazard.keyPrinciple}
                    </div>
                  </div>
                </div>
              )}

              {/* PAGE 5: MAP */}
              {currentStep === 5 && (
                <div className="space-y-6">
                  <div className="space-y-1">
                    <h2 className="text-2xl font-bold text-stone-900 flex items-center gap-2">
                      <span>📍</span>
                      <span>找到適合的避難地點與官方查詢管道</span>
                    </h2>
                    <p className="text-xs text-stone-600 font-normal">了解地震收容處所與防空處所差異：</p>
                  </div>

                  <div className="bubble-card p-5 space-y-3 text-xs">
                    <div className="font-bold text-stone-900 text-sm">🟢 避難處所示範列表</div>
                    <div className="space-y-2">
                      {MOCK_LOCATIONS.map(loc => (
                        <div key={loc.id} className="p-3 bg-stone-50 rounded-xl border border-stone-200 flex justify-between items-center">
                          <div>
                            <div className="font-bold text-stone-900">{loc.name}</div>
                            <div className="text-stone-500 font-normal">{loc.address}</div>
                          </div>
                          <span className="bg-orange-100 text-orange-900 font-medium px-3 py-1 rounded-full text-[11px]">
                            {loc.type === 'air_raid' ? '防空處所' : '避難收容處所'}
                          </span>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              )}

              {/* PAGE 6: FAMILY PLAN */}
              {currentStep === 6 && (
                <div className="space-y-6">
                  <div className="space-y-1">
                    <h2 className="text-2xl font-bold text-stone-900 flex items-center gap-2">
                      <span>🤝</span>
                      <span>和家人建立集合地點與通訊約定</span>
                    </h2>
                    <p className="text-xs text-stone-600 font-normal">約定好實體集合點與通訊備案：</p>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
                    <div className="bubble-card p-5 space-y-3">
                      <div className="font-bold text-stone-900 text-sm">📍 第一家庭集合點</div>
                      <input
                        type="text"
                        value={primaryPoint}
                        onChange={(e) => setPrimaryPoint(e.target.value)}
                        className="w-full p-3 bg-stone-50 border border-stone-200 rounded-xl font-normal"
                      />
                    </div>
                    <div className="bubble-card p-5 space-y-3">
                      <div className="font-bold text-stone-900 text-sm">🏫 第二家庭集合點 (跨區備用)</div>
                      <input
                        type="text"
                        value={secondaryPoint}
                        onChange={(e) => setSecondaryPoint(e.target.value)}
                        className="w-full p-3 bg-stone-50 border border-stone-200 rounded-xl font-normal"
                      />
                    </div>
                  </div>
                </div>
              )}

              {/* PAGE 7: FINAL COMPREHENSIVE REPORT */}
              {currentStep === 7 && (
                <div className="bubble-card p-6 md:p-8 space-y-6 print-card">
                  <div className="border-b-2 border-amber-200 pb-4 text-center md:text-left space-y-1">
                    <div className="flex items-center justify-between">
                      <h2 className="text-2xl md:text-3xl font-bold text-stone-900">🛡️ 我的家庭安全避難計畫書</h2>
                      <span className="text-xs bg-amber-500 text-white font-bold px-3 py-1 rounded-full print-hidden">完整詳盡版</span>
                    </div>
                    <p className="text-xs text-stone-500 font-normal">產出日期：{new Date().toLocaleDateString('zh-TW')} ｜ 依據《臺灣全民安全指引》（小橘書）規範製作</p>
                  </div>

                  <div className="space-y-2 text-xs">
                    <h3 className="font-bold text-stone-900 text-sm border-b pb-1">一、家庭成員數值與特殊照顧需求對照表</h3>
                    <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2.5">
                      {members.map((m) => (
                        <div key={m.id} className="p-3 bg-stone-50 rounded-xl border border-stone-200 space-y-1">
                          <div className="font-bold text-stone-900">{m.customName} ({m.relation})</div>
                          <div className="text-stone-600">年齡：{m.age || '未填'} 歲 ｜ 性別：{m.gender === 'male' ? '男' : m.gender === 'female' ? '女' : '多元'} ｜ 體重：{m.weight || '未填'} kg</div>
                        </div>
                      ))}
                    </div>
                  </div>

                  <div className="space-y-2 text-xs">
                    <h3 className="font-bold text-stone-900 text-sm border-b pb-1">二、避難包迷思挑戰學習對照</h3>
                    <div className="p-3 bg-amber-50 rounded-xl border border-amber-200 space-y-1 font-normal text-stone-800">
                      <div>💧 飲水量規格：<strong>{waterRequirementMl.toLocaleString()} ml ({waterRequirementKg} kg)</strong></div>
                      <div>💭 增加物資選擇：<strong>{reflectionOne}</strong></div>
                      <div>💭 減少物資選擇：<strong>{reflectionTwo}</strong></div>
                      <div>💭 特殊照護考量：<strong>{reflectionThree}</strong></div>
                    </div>
                  </div>

                  <div className="space-y-2 text-xs">
                    <h3 className="font-bold text-stone-900 text-sm border-b pb-1">三、家庭實體集合點與斷訊默契</h3>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      <div className="p-3 bg-stone-50 rounded-xl border border-stone-200">
                        <div className="font-bold text-orange-700">📍 第一集合點：</div>
                        <div className="font-medium text-stone-900">{primaryPoint}</div>
                      </div>
                      <div className="p-3 bg-stone-50 rounded-xl border border-stone-200">
                        <div className="font-bold text-orange-700">🏫 第二集合點：</div>
                        <div className="font-medium text-stone-900">{secondaryPoint}</div>
                      </div>
                    </div>
                  </div>

                  <button
                    onClick={() => window.print()}
                    className="cute-btn w-full py-4 bg-orange-500 hover:bg-orange-600 text-white font-bold text-base shadow-md cursor-pointer flex items-center justify-center gap-2 print-hidden"
                  >
                    <span>🖨️ 列印 / 另存為 PDF (帶回家貼冰箱！)</span>
                  </button>
                </div>
              )}
            </main>

            {/* Navigation Footer (只在 currentStep > 0 時顯示，避免首頁重複出現多的「下一步」按鈕) */}
            {currentStep > 0 && (
              <footer className="sticky bottom-0 bg-white/95 border-t border-amber-200 p-3.5 backdrop-blur-md z-30 shadow-md">
                <div className="max-w-4xl mx-auto flex items-center justify-between gap-3">
                  <button
                    onClick={() => { setCurrentStep(currentStep - 1); window.scrollTo({ top: 0, behavior: 'smooth' }); }}
                    className="cute-btn px-5 py-2.5 border border-stone-300 text-stone-700 bg-white hover:bg-stone-50 text-xs font-medium cursor-pointer"
                  >
                    ← 上一步
                  </button>

                  {currentStep < 7 && (
                    <button
                      onClick={() => { setCurrentStep(currentStep + 1); window.scrollTo({ top: 0, behavior: 'smooth' }); }}
                      className="cute-btn ml-auto px-7 py-2.5 bg-orange-500 hover:bg-orange-600 active:bg-orange-700 text-white font-bold text-sm md:text-base shadow-md cursor-pointer flex items-center gap-1.5"
                    >
                      <span>下一步 →</span>
                    </button>
                  )}
                </div>
              </footer>
            )}
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
