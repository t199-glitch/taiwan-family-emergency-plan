                          <div key={m.id} className="p-3 bg-stone-50 rounded-xl border border-stone-200 space-y-1">
                            <div className="font-bold text-stone-900">{m.customName} ({m.relation})</div>
                            {isPet ? (
                              <div className="text-amber-800 font-medium">🐾 寵物成員（免計算水糧與體重）</div>
                            ) : (
                              <div className="text-stone-600">年齡：{m.age || '未填'} 歲 ｜ 性別：{m.gender === 'male' ? '生理男性' : '生理女性'} ｜ 體重：{m.weight || '未填'} kg</div>
                            )}
                            <div className="text-orange-700 font-medium">特殊照顧：{m.specialNeeds.length > 0 ? m.specialNeeds.join('、') : '一般照應'}</div>
                          </div>
                        );
                      })}
                    </div>

                    {allSpecialNeeds.length > 0 && (
                      <div className="p-3.5 bg-orange-50 rounded-xl border border-orange-200 space-y-1 font-normal text-stone-800 mt-2">
                        <div className="font-bold text-orange-950">💡 特殊照顧成員專屬避難準備提醒：</div>
                        <ul className="list-disc list-inside space-y-1 text-stone-700">
                          {allSpecialNeeds.map(tag => (
                            <li key={tag}>{SPECIAL_CARE_GUIDELINES[tag]}</li>
                          ))}
                        </ul>
                      </div>
                    )}
                  </div>

                  <div className="space-y-2 text-xs">
                    <h3 className="font-bold text-stone-900 text-sm border-b pb-1">二、避難包成果物資清單與準備規格明細</h3>
                    <div className="bg-amber-50 p-3 rounded-xl border border-amber-200 font-medium text-amber-950 mb-2">
                      💧 主要使用者專屬 3 日飲水量：<strong>{waterRequirementMl.toLocaleString()} ml ({waterRequirementKg} kg)</strong>（依體重 {userWeight}kg × 15ml × 3日）
                    </div>

                    <table className="w-full text-left border-collapse border border-stone-200 text-xs">
                      <thead>
                        <tr className="bg-stone-100 font-bold border-b border-stone-200">
                          <th className="p-2 border-r">物資品名</th>
                          <th className="p-2 border-r">建議規格</th>
                          <th className="p-2 border-r">為什麼準備 (目的)</th>
                          <th className="p-2">準備位置分類</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-stone-200 text-stone-700">
                        <tr>
                          <td className="p-2 border-r font-bold">💧 個人飲水 (3日份)</td>
                          <td className="p-2 border-r">{waterRequirementKg} kg</td>
                          <td className="p-2 border-r">維持3日基本生命機能防止脫水致死</td>
                          <td className="p-2 text-orange-700 font-bold">🎒 隨身避難包</td>
                        </tr>
                        <tr>
                          <td className="p-2 border-r font-bold">🍙 即食乾糧/能量棒</td>
                          <td className="p-2 border-r">3 份 (約 1.2 kg)</td>
                          <td className="p-2 border-r">免烹煮即開即食，快速補充血糖與卡路里</td>
                          <td className="p-2 text-orange-700 font-bold">🎒 隨身避難包</td>
                        </tr>
                        <tr>
                          <td className="p-2 border-r font-bold">🧥 輕量鋁箔保暖毯</td>
                          <td className="p-2 border-r">1 領 (約 0.4 kg)</td>
                          <td className="p-2 border-r">折疊體積極小，有效反射體熱防止失溫</td>
                          <td className="p-2 text-orange-700 font-bold">🎒 隨身避難包</td>
                        </tr>
                        <tr>
                          <td className="p-2 border-r font-bold">🩹 常用外傷與個人處方藥</td>
                          <td className="p-2 border-r">1 包 (約 0.5 kg)</td>
                          <td className="p-2 border-r">處置擦傷止血與維持個人 7 天慢性病藥物</td>
                          <td className="p-2 text-orange-700 font-bold">🎒 隨身避難包</td>
                        </tr>
                        <tr>
                          <td className="p-2 border-r font-bold">🔦 LED手電筒與哨子</td>
                          <td className="p-2 border-r">1 組 (約 0.3 kg)</td>
                          <td className="p-2 border-r">停電夜間照明，受控瓦礫時高分貝吹哨求救</td>
                          <td className="p-2 text-orange-700 font-bold">🎒 隨身避難包</td>
                        </tr>
                        <tr>
                          <td className="p-2 border-r font-bold">📄 防水影本與數位隨身碟</td>
                          <td className="p-2 border-r">1 份 (約 0.2 kg)</td>
                          <td className="p-2 border-r">向救難人員確認身分與申請補助，輕便安全</td>
                          <td className="p-2 text-orange-700 font-bold">🎒 隨身避難包</td>
                        </tr>
                      </tbody>
                    </table>
                  </div>

                  <div className="space-y-2 text-xs">
                    <h3 className="font-bold text-stone-900 text-sm border-b pb-1">三、家庭實體集合點與斷訊默契</h3>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      <div className="p-3 bg-stone-50 rounded-xl border border-stone-200">
                        <div className="font-bold text-orange-700">📍 第一集合點：</div>
                        <div className="font-medium text-stone-900">{primaryPoint}</div>
                      </div>
                      <div className="p-3 bg-stone-50 rounded-xl border border-stone-200">
                        <div className="font-bold text-orange-700">🏫 第二集合點：</div>
                        <div className="font-medium text-stone-900">{secondaryPoint}</div>
                      </div>
                    </div>
                    <div className="p-3 bg-amber-50 rounded-xl border border-amber-200 space-y-1">
                      <div className="font-bold text-amber-950">📞 無網路/電話中斷時聯絡約定默契：</div>
                      <div className="text-stone-700 font-normal leading-relaxed">{thoughtAnswer}</div>
                    </div>
                  </div>

                  <button
                    onClick={() => window.print()}
                    className="cute-btn w-full py-4 bg-orange-500 hover:bg-orange-600 text-white font-bold text-base shadow-md cursor-pointer flex items-center justify-center gap-2 print-hidden"
                  >
                    <span>🖨️ 列印 / 另存為 PDF (帶回家貼冰箱對照準備！)</span>
                  </button>
                </div>
              )}
            </main>

            {/* Navigation Footer */}
            {currentStep > 0 && (
              <footer className="sticky bottom-0 bg-white/95 border-t border-amber-200 p-3.5 backdrop-blur-md z-30 shadow-md">
                <div className="max-w-4xl mx-auto flex items-center justify-between gap-3">
                  <button
                    onClick={() => { setCurrentStep(currentStep - 1); window.scrollTo({ top: 0, behavior: 'smooth' }); }}
                    className="cute-btn px-5 py-2.5 border border-stone-300 text-stone-700 bg-white hover:bg-stone-50 text-xs font-medium cursor-pointer"
                  >
                    ← 上一步
                  </button>

                  {currentStep < 7 && (
                    <button
                      onClick={() => { setCurrentStep(currentStep + 1); window.scrollTo({ top: 0, behavior: 'smooth' }); }}
                      className="cute-btn ml-auto px-7 py-2.5 bg-orange-500 hover:bg-orange-600 active:bg-orange-700 text-white font-bold text-sm md:text-base shadow-md cursor-pointer flex items-center gap-1.5"
                    >
                      <span>下一步 →</span>
                    </button>
                  )}
                </div>
              </footer>
            )}
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
