  <body className="bg-[#fffdfa] text-stone-800 antialiased selection:bg-amber-200">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect } = React;

      // 1. DATA & CONSTANTS
      const OFFICIAL_BOOK_INFO = {
        title: '《臺灣全民安全指引》（俗稱「小橘書」）',
        publisher: '中華民國國防部全民防衛動員署 / 內政部消防署',
        officialUrl: 'https://aod.mnd.gov.tw/'
      };

      // 災害應變資料 (更加詳細)
      const HAZARD_SCENARIOS = [
        {
          id: 'earthquake',
          name: '地震搖晃',
          icon: '🌏',
          shortDesc: '地震突發無預警，第一時間保護頭頸最要緊！',
          keyPrinciple: '趴下 (Drop)、掩護 (Cover)、穩住 (Hold on)。劇烈搖晃時絕不可亂跑或搭電梯！',
          detailedGuidance: [
            '1. 在室內：立即趴下躲於堅固桌下，抓住桌腳。若無桌子，避開玻璃窗戶與懸掛物，靠牆蹲下護頭。',
            '2. 在戶外：避開大樓外牆掉落玻璃、招牌及電線桿，移動至空曠區域蹲下保護頭部。',
            '3. 搖晃停止後：先關閉電源總開關與瓦斯閥門，檢查房屋結構，必要時攜緊急避難包往第一集合點或開闊避難處所。'
          ],
          quizQuestion: {
            title: '強烈地震正劇烈搖晃，人在室內第一時間最正確的處置是？',
            options: [
              { id: 'a', label: '急忙搭電梯衝出大樓', isCorrect: false, explanation: '❌ 迷思解析：強震時移動極易摔倒砸傷，且電梯極可能因停電停擺而將人困死於井道內！' },
              { id: 'b', label: '趴下、掩護於堅固桌下，雙手緊握桌腳保護頭頸', isCorrect: true, explanation: '✅ 完全正確！「趴下、掩護、穩住」是國際公認防護黃金原則，能有效防範掉落物砸傷。' },
              { id: 'c', label: '跑去開大門並站在門框下', isCorrect: false, explanation: '❌ 迷思解析：現代建築門框並無額外結構支撐，強震中站在門框容易被兩側掉落物砸中。' }
            ]
          }
        },
        {
          id: 'typhoon_flood',
          name: '豪雨淹水',
          icon: '🌧️',
          shortDesc: '豪雨積淹水升溫迅速，切勿滯留地下室或低窪區。',
          keyPrinciple: '預先切斷水電瓦斯總開關，提早攜避難包前往二樓以上高處或指定收容所避難。',
          detailedGuidance: [
            '1. 預先防範：清理屋頂排水孔、測試水閘門，車輛移至高處停車場。',
            '2. 撤離警戒：當收到強制撤離通知或積水升高時，切斷電源瓦斯後，隨即往高處或避難處所撤离。',
            '3. 安全禁止：絕對不可滯留地下室清理物品，淹水道路切勿徒步涉水或強行開車通過。'
          ],
          quizQuestion: {
            title: '低窪地區積水已漫過腳踝，且雨勢持續加大時應如何應對？',
            options: [
              { id: 'a', label: '繼續留在地下室搬運貴重物品', isCorrect: false, explanation: '❌ 迷思解析：暴雨時地下室積水速度極快，水壓常導致地下室門窗無法開啟而受困溺水！' },
              { id: 'b', label: '關閉水電瓦斯總開關，帶避難包往高處或指定收容所撤離', isCorrect: true, explanation: '✅ 完全正確！關閉水源電源防止觸電，並立即往高處避難是最安全的方式。' }
            ]
          }
        },
        {
          id: 'tsunami',
          name: '海嘯來襲',
          icon: '🌊',
          shortDesc: '沿海強震或發布海嘯警報時，時間就是生命！',
          keyPrinciple: '海嘯避難三原則：「往高處、往內陸、立即行動」。切勿前往海岸觀浪！',
          detailedGuidance: [
            '1. 黃金原則：感受強震或海水出現異常快速退潮時，不等警報即刻向內陸高處撤離。',
            '2. 高度要求：前往海拔 20 公尺以上高地，或堅固鋼筋混凝土大樓 3 樓以上高層避難。',
            '3. 嚴禁觀浪：第一波海嘯過後切勿返回海岸，海嘯常有多波且後續波幅可能更大。'
          ],
          quizQuestion: {
            title: '在海岸邊聽到海嘯警報聲響起或發現異常快速退潮時？',
            options: [
              { id: 'a', label: '走向海灘觀看海水退潮狀況', isCorrect: false, explanation: '❌ 迷思解析：海嘯波速極快（每小時可達數百公里），看到巨浪時通常已無法逃跑！' },
              { id: 'b', label: '立即往內陸高處（海拔20m以上或高樓3樓以上）迅速撤離', isCorrect: true, explanation: '✅ 完全正確！「往高處、往內陸、立即行動」是海嘯唯一生存法則！' }
            ]
          }
        },
        {
          id: 'air_raid',
          name: '空襲防空',
          icon: '🚨',
          shortDesc: '防空警報響起或收到手機警報時，立即找尋地下防空處所。',
          keyPrinciple: '進入無窗地下室或防空處所，採「雙膝跪地、拱背、遮眼耳、嘴微張」姿勢。',
          detailedGuidance: [
            '1. 戶外人員：立即聽從警察民防人員引導，進入附近標示有防空避難圖示之地下室或捷運站。',
            '2. 室內人員：關閉水電瓦斯總開關與門窗，進入無窗戶房間或地下室，避開玻璃窗。',
            '3. 防護姿勢：採雙膝跪地、身體拱起、雙手遮住眼耳、嘴角微張（防止震波造成胸腔與耳膜壓傷）。'
          ],
          quizQuestion: {
            title: '防空警報響起時，人在家中室內最正確的防護姿勢是？',
            options: [
              { id: 'a', label: '站在陽台或窗戶邊觀看外面狀況', isCorrect: false, explanation: '❌ 迷思解析：衝擊波會震碎窗戶玻璃造成嚴重割傷，空襲時必須遠離所有窗戶！' },
              { id: 'b', label: '進入無窗房間或地下室，採雙膝跪地拱背遮眼耳姿勢', isCorrect: true, explanation: '✅ 完全正確！雙膝跪地拱背能保護內臟耳膜，無窗空間能避免玻璃破裂割傷。' }
            ]
          }
        }
      ];

      // 迷思破除與挑選清單 (Item 8 要求)
      const MYTH_ITEMS_LIST = [
        { id: 'myth_1', name: '🏕️ 超大雙人野營帳篷與睡袋', isMyth: true, explanation: '❌ 迷思物品：帳篷體積過大且重量超過 5kg，會嚴重拖慢避難撤離速度！避難包應以輕便保暖毯代替。' },
        { id: 'myth_2', name: '💧 個人專屬飲用水 (3日份)', isMyth: false, specExplanation: '✅ 必備物資：依體重x15mlx3天計算（如60kg約需2.7L），維持3天生命基本水分缺乏。' },
        { id: 'myth_3', name: '💎 大量金飾貴重珠寶與大量現金', isMyth: true, explanation: '❌ 迷思物品：貴重珠寶易引來覬覦風險，且緊急狀況下無法交易。避難包僅需放少量百元硬幣與零錢。' },
        { id: 'myth_4', name: '🔦 LED手電筒與高分貝求救哨', isMyth: false, specExplanation: '✅ 必備物資：受困暗處或受困瓦礫掩埋時，吹哨能節省體力並發出高分貝聲響吸引救難人員。' },
        { id: 'myth_5', name: '🔪 廚房大菜刀與玻璃罐頭', isMyth: true, explanation: '❌ 迷思物品：玻璃瓶易割傷且重，菜刀不便攜帶。應選易拉開之鐵罐/軟包乾糧與多功能工具刀。' },
        { id: 'myth_6', name: '🩹 急救消毒包與個人藥物', isMyth: false, specExplanation: '✅ 必備物資：含 OK 繃、紗布、消毒水與個人 7 日處方慢性藥物，防止傷口感染與發病。' }
      ];

      // 物資清單與規格說明 (Item 7 要求)
      const PRESET_GO_BAG_ITEMS = [
        { id: 'i1', name: '💧 個人專屬飲用水 (3日份)', qty: 1, weight: 2.7, whyNeed: '維持人體生理運作防止脫水致死', whySpec: '官方標準體重x15mlx3天，平衡重量與生存需求' },
        { id: 'i2', name: '🍙 高熱量耐保存乾糧/能量棒', qty: 3, weight: 1.2, whyNeed: '快速補充卡路里體力以維持血糖', whySpec: '選擇不需加熱、即開即食且保存期1年以上乾糧' },
        { id: 'i3', name: '🩹 急救包 (紗布/OK繃/消毒水)', qty: 1, weight: 0.4, whyNeed: '撤離時外傷即時止血與消毒', whySpec: '防水包裝，含常用外傷處置與個人處方藥' },
        { id: 'i4', name: '🔦 LED手電筒 (含備用電池)', qty: 1, weight: 0.25, whyNeed: '夜間停電或地下處所照明求生', whySpec: '選擇輕量 LED 高亮度且省電款式' },
        { id: 'i5', name: '📣 高分貝求救小哨子', qty: 1, weight: 0.05, whyNeed: '受困受傷時傳遞求救訊號', whySpec: '掛於背包外側，比大聲呼喊更省體力傳更遠' },
        { id: 'i6', name: '🧥 輕量保暖毯 / 救生雨衣', qty: 1, weight: 0.2, whyNeed: '防止失溫與雨水淋濕導致體溫下降', whySpec: '鋁箔保暖折疊毯，體積小且反射體熱效果佳' }
      ];

      const MOCK_LOCATIONS = [
        { id: 'loc_1', name: '建國高級中學避難收容處所 🏫', address: '臺北市中正區南海路56號', type: 'shelter', capacity: '2,500 人' },
        { id: 'loc_2', name: '捷運大安站地下防空避難處所 🚇', address: '臺北市大安區信義路四段2號B1', type: 'air_raid', capacity: '4,000 人' },
        { id: 'loc_3', name: '臺中一中避難收容處所 🏫', address: '臺中市北區育才街2號', type: 'shelter', capacity: '3,000 人' },
        { id: 'loc_4', name: '高雄高級中學避難處所 🏫', address: '高雄市三民區建國三路50號', type: 'shelter', capacity: '2,800 人' }
      ];

      // 2. HELPER FUNCTIONS
      function calculateWaterRequirement(weightKg) {
        const safeWeight = Math.max(0, weightKg || 0);
        const totalMl = safeWeight * 15 * 3;
        const totalKg = (totalMl / 1000).toFixed(2);
        return { totalMl, totalKg, formattedText: `${totalMl.toLocaleString()} ml (${totalKg} kg)` };
      }

      function calculateBagWeight(member, items) {
        const waterKg = parseFloat(calculateWaterRequirement(member.weight || 0).totalKg);
        const itemsKg = items.reduce((sum, i) => sum + (i.weight * i.qty), 0);
        const totalKg = (waterKg + itemsKg + 0.8).toFixed(1);
        let maxKg = member.gender === 'male' ? 15 : 10;
        return { totalKg, maxKg, isOver: totalKg > maxKg };
      }

      // 3. MAIN REACT APP
      function App() {
        const [currentStep, setCurrentStep] = useState(0);

        // 成員彈性設定 (Item 3 & Item 5 要求)
        const [members, setMembers] = useState([
          { id: 'm1', relation: '我', customName: '我', age: '', gender: 'other', height: '', weight: '', specialNeeds: [] }
        ]);

        // 新增成員彈性選項
        const [newCustomRelation, setNewCustomRelation] = useState('');
        const [newSpecialRole, setNewSpecialRole] = useState('一般家人');

        // 物資與迷思選擇
        const [selectedMythItemIds, setSelectedMythItemIds] = useState(['myth_2', 'myth_4', 'myth_6']);
        const [goBagItems, setGoBagItems] = useState(PRESET_GO_BAG_ITEMS);

        // 家庭約定 (Item 11 要求)
        const [primaryPoint, setPrimaryPoint] = useState('住家附近公園正門告示牌');
        const [secondaryPoint, setSecondaryPoint] = useState('附近國民小學司令台');
        const [offlineCommChoice, setOfflineCommChoice] = useState(['1991報平安平台', '手搖防災廣播']);
        const [thoughtAnswer, setThoughtAnswer] = useState('若家人在不同地點且網路斷訊，我們約定放學或災害結束後，於「第一集合點大樹下」會合。');

        // 災害與地圖
        const [selectedHazard, setSelectedHazard] = useState(HAZARD_SCENARIOS[0]);
        const [quizAnswer, setQuizAnswer] = useState(null);

        const activeMember = members[0];
        const waterInfo = calculateWaterRequirement(activeMember.weight || 55);
        const weightInfo = calculateBagWeight(activeMember, goBagItems);

        const STEPS = [
          { id: 0, label: '首頁', icon: '🏠' },
          { id: 1, label: '認識家人', icon: '👨‍👩‍👧‍👦' },
          { id: 2, label: '讀小橘書', icon: '📖' },
          { id: 3, label: '避難包', icon: '🎒' },
          { id: 4, label: '認識災害', icon: '🌏' },
          { id: 5, label: '避難地圖', icon: '📍' },
          { id: 6, label: '家庭約定', icon: '🤝' },
          { id: 7, label: '完成計畫', icon: '🛡️' }
        ];

        // 增加與刪除成員 (Item 4 & Item 5 要求)
        const addMember = (relName) => {
          const name = relName || newCustomRelation || '家庭成員';
          setMembers([...members, {
            id: `m_${Date.now()}`,
            relation: name,
            customName: name,
            age: '',
            gender: 'other',
            height: '',
            weight: '',
            specialNeeds: newSpecialRole !== '一般家人' ? [newSpecialRole] : []
          }]);
          setNewCustomRelation('');
        };

        const deleteMember = (id) => {
          if (members.length <= 1) {
            alert('至少需保留一位主要使用者喔！');
            return;
          }
          setMembers(members.filter(m => m.id !== id));
        };

        const toggleMythItem = (id) => {
          if (selectedMythItemIds.includes(id)) {
            setSelectedMythItemIds(selectedMythItemIds.filter(i => i !== id));
          } else {
            setSelectedMythItemIds([...selectedMythItemIds, id]);
          }
        };

        return (
          <div className="min-h-screen flex flex-col justify-between text-stone-800">
            {/* Header Progress Bar (Item 2 要求的標題字體調整) */}
            <header className="bg-amber-100/90 border-b border-amber-300/80 sticky top-0 z-40 p-3 backdrop-blur-md">
              <div className="max-w-5xl mx-auto flex items-center justify-between">
                <button onClick={() => setCurrentStep(0)} className="font-semibold text-amber-950 text-base md:text-lg flex items-center gap-2 cursor-pointer hover:opacity-80">
                  <span className="text-2xl">🛡️</span>
                  <span>我的家庭安全避難計畫</span>
                </button>

                <div className="bg-amber-500 text-white font-medium text-xs px-3.5 py-1.5 rounded-full shadow-xs flex items-center gap-1.5">
                  <span>{STEPS[currentStep].icon}</span>
                  <span>STEP {currentStep} / 7：{STEPS[currentStep].label}</span>
                </div>
              </div>

              {/* Progress Line */}
              <div className="max-w-5xl mx-auto w-full bg-amber-200 h-2 rounded-full mt-2 overflow-hidden">
                <div className="bg-orange-500 h-full transition-all duration-300 rounded-full" style={{ width: `${(currentStep / 7) * 100}%` }}></div>
              </div>
            </header>

            {/* Main Content */}
            <main className="max-w-4xl mx-auto p-4 md:p-6 flex-1 w-full space-y-6">
              {/* PAGE 0: HERO (Item 1 要求的文案修改) */}
              {currentStep === 0 && (
                <div className="space-y-6 text-center py-2">
                  <div className="bg-linear-to-b from-orange-100 via-amber-50 to-white p-8 md:p-12 rounded-3xl border border-orange-200 shadow-xs space-y-6">

                      <span>和家人建立集合地點與通訊約定</span>
                    </h2>
                    <p className="text-xs text-stone-600 font-normal">參考選址準則，與家人討論並填寫極端狀況下的集合地點：</p>
                  </div>

                  {/* 集合點選址準則指南 (Item 11 要求) */}
                  <div className="bg-amber-50 p-5 rounded-2xl border border-amber-300 space-y-2 text-xs">
                    <div className="font-bold text-amber-950 text-sm">💡 良好家庭集合點的選擇四大準則：</div>
                    <ul className="list-disc list-inside space-y-1 text-stone-700 font-normal leading-relaxed">
                      <li><strong>安全開闊：</strong>遠離高樓玻璃外牆、電線桿、高夾板與老舊圍牆（如住家附近的公園正門）。</li>
                      <li><strong>標的明確：</strong>具有顯眼地標或告示牌，方便走散時辨識。</li>
                      <li><strong>備用跨區：</strong>第二集合點應選擇跨區或稍遠的安全地點（如附近國民小學體育館）。</li>
                      <li><strong>定期實地走一次：</strong>帶著父母與家人實際走一次路線，確認無障礙通暢。</li>
                    </ul>
                  </div>

                  {/* 集合點輸入 */}
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div className="bubble-card p-5 space-y-3 text-xs">
                      <div className="font-bold text-stone-900 text-sm">📍 第一家庭集合點 (近家周邊開闊點)</div>
                      <input
                        type="text"
                        value={primaryPoint}
                        onChange={(e) => setPrimaryPoint(e.target.value)}
                        className="w-full p-3 bg-stone-50 border border-stone-200 rounded-xl font-normal focus:border-orange-400 focus:outline-hidden"
                      />
                    </div>

                    <div className="bubble-card p-5 space-y-3 text-xs">
                      <div className="font-bold text-stone-900 text-sm">🏫 第二家庭集合點 (跨區備用學校)</div>
                      <input
                        type="text"
                        value={secondaryPoint}
                        onChange={(e) => setSecondaryPoint(e.target.value)}
                        className="w-full p-3 bg-stone-50 border border-stone-200 rounded-xl font-normal focus:border-orange-400 focus:outline-hidden"
                      />
                    </div>
                  </div>

                  {/* 通訊備案與默契 */}
                  <div className="bg-white p-5 rounded-2xl border border-stone-200 space-y-3 text-xs">
                    <div className="font-bold text-stone-900 text-sm">📞 手機與行動網路中斷時之聯絡默契：</div>
                    <textarea
                      rows={3}
                      value={thoughtAnswer}
                      onChange={(e) => setThoughtAnswer(e.target.value)}
                      className="w-full p-3 bg-stone-50 border border-stone-200 rounded-xl font-normal text-stone-800 focus:outline-hidden"
                    />
                  </div>
                </div>
              )}

              {/* PAGE 7: FINAL COMPREHENSIVE REPORT (Item 12 極度詳細之計畫書) */}
              {currentStep === 7 && (
                <div className="bubble-card p-6 md:p-8 space-y-6 print-card">
                  {/* 計畫書抬頭 */}
                  <div className="border-b-2 border-amber-200 pb-4 text-center md:text-left space-y-1">
                    <div className="flex items-center justify-between">
                      <h2 className="text-2xl md:text-3xl font-bold text-stone-900">🛡️ 我的家庭安全避難計畫書</h2>
                      <span className="text-xs bg-amber-500 text-white font-bold px-3 py-1 rounded-full print-hidden">完整詳盡版</span>
                    </div>
                    <p className="text-xs text-stone-500 font-normal">產出日期：{new Date().toLocaleDateString('zh-TW')} ｜ 依據《臺灣全民安全指引》（小橘書）規範製作</p>
                  </div>

                  {/* 1. 家庭成員與照顧需求 */}
                  <div className="space-y-2 text-xs">
                    <h3 className="font-bold text-stone-900 text-sm border-b pb-1">一、家庭成員數值與特殊照顧需求對照表</h3>
                    <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2.5">
                      {members.map((m, idx) => (
                        <div key={m.id} className="p-3 bg-stone-50 rounded-xl border border-stone-200 space-y-1">
                          <div className="font-bold text-stone-900">{m.customName} ({m.relation})</div>
                          <div className="text-stone-600">年齡：{m.age || '未填'} 歲 ｜ 性別：{m.gender === 'male' ? '男' : m.gender === 'female' ? '女' : '多元'} ｜ 體重：{m.weight || '未填'} kg</div>
                          <div className="text-orange-700 font-medium">特殊照顧：{m.specialNeeds.length > 0 ? m.specialNeeds.join('、') : '一般照應'}</div>
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* 2. 物資清單與飲水量 */}
                  <div className="space-y-2 text-xs">
                    <h3 className="font-bold text-stone-900 text-sm border-b pb-1">二、避難包個人物資清單與飲水量規格 (3日份)</h3>
                    <div className="bg-amber-50 p-3 rounded-xl border border-amber-200 font-medium text-amber-950 mb-2">
                      💧 主要使用者專屬 3 日飲水量：{waterInfo.formattedText}（依體重 {activeMember.weight || 55}kg × 15ml × 3日）
                    </div>

                    <table className="w-full text-left border-collapse border border-stone-200 text-xs">
                      <thead>
                        <tr className="bg-stone-100 font-bold border-b border-stone-200">
                          <th className="p-2 border-r">物資品名</th>
                          <th className="p-2 border-r">數量規格</th>
                          <th className="p-2 border-r">為什麼準備 (目的)</th>
                          <th className="p-2">官方規格說明</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-stone-200 text-stone-700">
                        {PRESET_GO_BAG_ITEMS.map((item) => (
                          <tr key={item.id}>
                            <td className="p-2 border-r font-bold">{item.name}</td>
                            <td className="p-2 border-r">{item.qty} 組 ({item.weight} kg)</td>
                            <td className="p-2 border-r">{item.whyNeed}</td>
                            <td className="p-2">{item.whySpec}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>

                  {/* 3. 災害避難處所與應變步驟 */}
                  <div className="space-y-2 text-xs">
                    <h3 className="font-bold text-stone-900 text-sm border-b pb-1">三、各類災害避難方向與核心姿勢矩陣表</h3>
                    <table className="w-full text-left border-collapse border border-stone-200 text-xs">
                      <thead>
                        <tr className="bg-stone-100 font-bold border-b border-stone-200">
                          <th className="p-2 border-r">災害類型</th>
                          <th className="p-2 border-r">主要避難方向</th>
                          <th className="p-2">小橘書核心防護動作姿勢</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-stone-200 text-stone-700">
                        <tr>
                          <td className="p-2 border-r font-bold">🌏 強烈地震</td>
                          <td className="p-2 border-r">住家附近公園或開闊收容處所</td>
                          <td className="p-2">趴下、掩護、穩住於堅固桌下，抓住桌腳護頭頸</td>
                        </tr>
                        <tr>
                          <td className="p-2 border-r font-bold">🌧️ 豪雨淹水</td>
                          <td className="p-2 border-r">二樓以上高處或指定收容處所</td>
                          <td className="p-2">關閉水電瓦斯總開關，提早往高處撤離，嚴禁滯留地下室</td>
                        </tr>
                        <tr>
                          <td className="p-2 border-r font-bold">🌊 海嘯來襲</td>
                          <td className="p-2 border-r">海拔 20m 以上高處或高樓 3 樓以上</td>
                          <td className="p-2">海嘯三原則：往高處、往內陸、立即行動</td>
                        </tr>
                        <tr>
                          <td className="p-2 border-r font-bold">🚨 空襲警報</td>
                          <td className="p-2 border-r">地下防空避難處所或捷運車站地下層</td>
                          <td className="p-2">無窗空間，採雙膝跪地拱背遮掩眼耳、嘴微張姿勢</td>
                        </tr>
                      </tbody>
                    </table>
                  </div>

                  {/* 4. 家庭集合約定與通訊備案 */}
                  <div className="space-y-2 text-xs">
                    <h3 className="font-bold text-stone-900 text-sm border-b pb-1">四、家庭實體集合點與通訊備案</h3>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      <div className="p-3 bg-stone-50 rounded-xl border border-stone-200 space-y-1">
                        <div className="font-bold text-orange-700">📍 第一集合點 (近家周邊)：</div>
                        <div className="font-medium text-stone-900">{primaryPoint}</div>
                      </div>
                      <div className="p-3 bg-stone-50 rounded-xl border border-stone-200 space-y-1">
                        <div className="font-bold text-orange-700">🏫 第二集合點 (跨區備用)：</div>
                        <div className="font-medium text-stone-900">{secondaryPoint}</div>
                      </div>
                    </div>
                    <div className="p-3 bg-amber-50 rounded-xl border border-amber-200 space-y-1">
                      <div className="font-bold text-amber-950">📞 無網路/電話中斷時聯絡約定默契：</div>
                      <div className="text-stone-700 font-normal leading-relaxed">{thoughtAnswer}</div>
                    </div>
                  </div>

                  {/* 5. 緊急報案專線號碼 */}
                  <div className="p-4 bg-stone-900 text-white rounded-2xl text-xs space-y-2">
                    <div className="font-bold text-amber-400">📞 重要緊急救援與報平安專線電話：</div>
                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 font-medium">
                      <div>🚨 報案專線：110</div>
                      <div>🚒 消防救護：119</div>
                      <div>📞 報平安平台：1991</div>
                      <div>🏢 縣市服務：1999</div>
                    </div>
                  </div>

                  {/* 列印按鈕 */}
                  <button
                    onClick={() => window.print()}
                    className="cute-btn w-full py-4 bg-orange-500 hover:bg-orange-600 text-white font-bold text-base md:text-lg shadow-md cursor-pointer flex items-center justify-center gap-2 print-hidden"
                  >
                    <span>🖨️ 列印 / 另存為 PDF (可貼於冰箱上與家人對照實踐！)</span>
                  </button>
                </div>
              )}
            </main>

            {/* Bottom Floating Navigation */}
            <footer className="sticky bottom-0 bg-white/95 border-t border-amber-200 p-3.5 backdrop-blur-md z-30 shadow-md">
              <div className="max-w-4xl mx-auto flex items-center justify-between gap-3">
                {currentStep > 0 ? (
                  <button
                    onClick={() => { setCurrentStep(currentStep - 1); window.scrollTo({ top: 0, behavior: 'smooth' }); }}
                    className="cute-btn px-5 py-2.5 border border-stone-300 text-stone-700 bg-white hover:bg-stone-50 text-xs font-medium cursor-pointer"
                  >
                    ← 上一步
                  </button>
                ) : <div />}

                {currentStep < 7 && (
                  <button
                    onClick={() => { setCurrentStep(currentStep + 1); window.scrollTo({ top: 0, behavior: 'smooth' }); }}
                    className="cute-btn ml-auto px-7 py-2.5 bg-orange-500 hover:bg-orange-600 active:bg-orange-700 text-white font-bold text-sm md:text-base shadow-md cursor-pointer flex items-center gap-1.5"
                  >
                    <span>下一步 →</span>
                  </button>
                )}
              </div>
            </footer>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
